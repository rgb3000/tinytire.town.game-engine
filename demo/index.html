<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline so the dev server does not log a 404 for a file that does not exist. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%9A%97</text></svg>"
    />
    <title>@tinytire/engine — playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- The canvas fills the window and the panels sit on top of it. This is not a
         stylistic choice: Game, MapDesigner and Renderer all size themselves from
         window.innerWidth/innerHeight rather than the canvas's own client rect, so a
         canvas laid out beside a sidebar renders at the wrong scale. -->
    <div id="canvas-host"></div>

    <!-- Every cluster below is transparent to the pointer; only the control surfaces
         inside them take clicks, so the board stays drawable in all the gaps. The
         rule lives in style.css under "pointer transparency". -->
    <div id="chrome">
      <header id="topbar"></header>
      <div id="hud-stats"></div>
      <div id="hud-demand"></div>
      <div id="dock"></div>
      <div id="utility"></div>
      <aside id="panel"></aside>
    </div>

    <!-- Blocking cards: start, game over. -->
    <div id="overlay"></div>
    <!-- Non-blocking card: the weekly bonus. Roads can still be drawn while it is up,
         because the engine keeps the road drawer running during that pause. -->
    <div id="toast"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
