name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The demo is the only thing that exercises the rendering, input, and audio
      # layers, none of which the Node test suite can reach. Building it will not
      # catch a runtime fault, but it does catch an import that no longer resolves.
      - run: npm run build:demo
